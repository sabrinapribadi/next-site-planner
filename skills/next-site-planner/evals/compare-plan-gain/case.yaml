name: compare-plan-gain
expected_outcome: |
  Opens with the data used and the baseline (KPI ranking: equal-weight slow speed, population, places) and why. Names the UAE as the largest relative gain (about 3.8 times, +281%) but on a 29.3 tower-equivalent budget and about 311 people, gives baseline and plan people lifted per country, and points to the Philippines and Indonesia as the largest absolute wins.
