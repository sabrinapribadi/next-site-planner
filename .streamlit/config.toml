# Theme for the Streamlit companion app (R26). Dark by default, like the portfolio's featured apps: LinkedIn's preview
# is an automatic screenshot of the first screen, so the KPI strip must be visible there.
[theme]
base = "dark"
primaryColor = "#8f81f0"
backgroundColor = "#0e0f17"
secondaryBackgroundColor = "#181a26"
textColor = "#e8e8f0"
linkColor = "#a99ff5"
borderColor = "#2b2c3c"
codeBackgroundColor = "#181a26"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseRadius = "0.6rem"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = true
metricValueFontSize = "1.9rem"
metricValueFontWeight = 700
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70"]

[theme.sidebar]
backgroundColor = "#12131d"
secondaryBackgroundColor = "#1d1f2d"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
