name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt ruff
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 src scripts tests
      - run: python -m pytest -q tests


  # R10/R19: the pages' browser tests in real Chrome (desktop light, dark, phone 400 px); a failure blocks publishing.
  browser:
    runs-on: ubuntu-latest
    env:
      NODE_PATH: /tmp/pt/node_modules
      CHROME_ARGS: --no-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-save --prefix /tmp/pt puppeteer-core@23.11.1
      - run: echo "CHROME_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
      - run: node tests/browser/hover_test.js "$PWD/docs/index.html" /tmp
      - run: node tests/browser/build_test.js "$PWD/docs/build.html" /tmp

  # R19: GitHub Pages deploy from main by workflow, only after unit and browser tests pass.
  pages:
    needs: [test, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deploy
        uses: actions/deploy-pages@v4

  # CD (R19, ADR-011): fetch the checksummed serving store (release asset), build the bundle, sign its provenance,
  # deploy to Vercel Hobby, smoke-test the live URL. Skips the deploy (job stays green) until the token and asset exist.
  deploy:
    needs: [test, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # signs the build provenance
      attestations: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Fetch the serving store (release asset)
        id: data
        run: |
          if gh release download serving-data-v1 -p serving_data.tar.gz -D build; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Release asset serving-data-v1 not found; deploy skipped."; fi
      - name: Build the bundle (checks the store's SHA-256)
        if: steps.data.outputs.ok == 'true'
        run: |
          python scripts/build_deploy.py --data build/serving_data.tar.gz --out build/next-site-planner
          tar -czf build/next-site-planner.tar.gz -C build next-site-planner
      - name: Sign build provenance
        if: steps.data.outputs.ok == 'true'
        uses: actions/attest-build-provenance@v4
        with: {subject-path: build/next-site-planner.tar.gz}
      - name: Deploy to Vercel (production)
        if: steps.data.outputs.ok == 'true' && env.VERCEL_TOKEN != ''
        id: vercel
        working-directory: build/next-site-planner
        run: echo "url=$(npx -y vercel@65.4.0 deploy --prod --yes --token "$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
      - name: Smoke test the live URL
        if: steps.data.outputs.ok == 'true' && env.VERCEL_TOKEN != ''
        run: python scripts/smoke_test.py "${{ vars.PUBLIC_URL || steps.vercel.outputs.url }}"
      - name: No token yet
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN not set; deploy skipped."
