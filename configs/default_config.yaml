# ============================================================
# Default configuration — next-site-planner (GEO-1)
# ============================================================

paths:
  data_dir: ${GEO_DATA_DIR}          # raw data outside the repo (OneDrive github_project/data/geo)
  outputs_dir: data/outputs          # small, committed artefacts only

countries:                           # ADR-001; FRA metropolitan only, USA lower 48
  IDN: Indonesia
  MYS: Malaysia
  PHL: Philippines
  DEU: Germany
  FRA: France
  USA: United States
  ARE: United Arab Emirates

grid:
  h3_resolution: 8                   # ~0.74 km² hexagons (ADR-001)

experience:
  latest_quarter: [2026, 3]
  first_quarter: [2023, 1]
  thresholds_mbps: [10, 25]          # headline bars
  sensitivity_mbps: [5, 50, 100]     # 100: BNetzA 2019 obligation, ITU-R M.2410 (ADR-003)
  density_deciles: 10                # density-adjusted comparison
  bootstrap_reps: 500

morphology:                          # Degree of Urbanisation thresholds (ADR-003, E2)
  urban_centre: {min_density_km2: 1500, min_population: 50000}
  urban_cluster: {min_density_km2: 300, min_population: 5000}

gap_typing:                          # ADR-003, E1
  cell_radios: [LTE, NR]
  detection_fast_mbps: 50            # completeness check: fast hexagons must have a cell nearby
  min_detection_rate: 0.80           # type gaps only where OpenCelliD finds it >= 80% of the time (set after the check)
  cell_search_ring: 1                # ring-1 ≈ 1.3 km; ring-0 as sensitivity

service_isd_m:                       # 3GPP TR 38.901 Tables 7.2-1 / 7.2-3 (ADR-003, E3)
  urban_centre: 500                  # UMa
  urban_centre_small_cell: 200       # UMi street canyon
  urban_cluster: 500                 # UMa
  rural: 1732                        # RMa; 5000 in sensitivity
  rural_sensitivity: 5000

cost_new_tower_equivalents:          # FCC 17-126 para. 46 (ADR-003, E4–E5)
  new_macro: 1.0
  colocation: {central: 0.30, range: [0.20, 0.50]}
  small_cell: {central: 0.50, range: [0.25, 0.50]}

gates:                               # ADR-002, written before analysis
  p0_min_population_assigned: 0.99
  p0_min_tests_assigned: 0.99
  p2_max_rmse_ratio_vs_kriging: 0.90
  p4_min_people_lift_vs_ranking: 0.10

# ----- P5 site notes (ADR-009, rule R13). Prices: developers.openai.com/api/docs/pricing, retrieved 2026-10-14 (USD per 1M tokens) -----
notes:
  provider: openai                   # one line to swap; no key → template notes only
  model: gpt-6-luna
  reasoning_effort: none
  price_input_per_m: 0.10
  price_cached_input_per_m: 0.01
  price_output_per_m: 0.50
  max_output_tokens: 200
  timeout_s: 10
  budget_cost_per_1000: 0.20         # USD per 1,000 live notes
  budget_p95_ms_live: 3000
  budget_p95_ms_cached: 50
